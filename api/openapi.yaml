      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [internal_enabled, digest_frequency], properties: {internal_enabled: {type: boolean}, digest_frequency: {type: string, enum: [never, daily, weekly]}, quiet_from: {type: string, format: time}, quiet_to: {type: string, format: time}}}}}}
      responses: {'200': {description: Настройки сохранены, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /reports/classes/{id}:
    get:
      tags: [content]
      operationId: classReport
      parameters: [{$ref: '#/components/parameters/ID'}, {name: academic_period_id, in: query, required: true, schema: {type: string, format: uuid}}, {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}]
      responses: {'200': {description: Отчёт класса или CSV, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}, text/csv: {schema: {type: string}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /reports/students/{id}:
    get:
      tags: [content]
      operationId: studentReport
      parameters: [{$ref: '#/components/parameters/ID'}, {name: academic_period_id, in: query, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Успеваемость и посещаемость ученика, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /reports/classes/{id}/attendance:
    get:
      tags: [content]
      operationId: classAttendanceReport
      parameters: [{$ref: '#/components/parameters/ID'}, {name: academic_period_id, in: query, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Посещаемость класса, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /reports/unfilled:
    get:
      tags: [content]
      operationId: unfilledLessonsReport
      parameters: [{name: academic_period_id, in: query, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Незаполненные уроки, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /reports/subjects/{id}:
    get:
      tags: [content]
      operationId: subjectReport
      parameters: [{$ref: '#/components/parameters/ID'}, {name: class_id, in: query, required: true, schema: {type: string, format: uuid}}, {name: academic_period_id, in: query, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Сводка по предмету, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /audit:
    get:
      tags: [administration]
      operationId: listAudit
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}, {name: entity_type, in: query, schema: {type: string}}, {name: entity_id, in: query, schema: {type: string, format: uuid}}, {name: actor_id, in: query, schema: {type: string, format: uuid}}, {name: action, in: query, schema: {type: string}}, {name: from, in: query, schema: {type: string, format: date-time}}, {name: to, in: query, schema: {type: string, format: date-time}}]
      responses: {'200': {description: Записи аудита, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /users/{id}/reactivate:
    post:
      tags: [administration]
      operationId: reactivateUser
      summary: Вернуть деактивированного пользователя
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '200': {description: Пользователь активен, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/password-reset:
    post:
      tags: [administration]
      operationId: resetUserPassword
      summary: Выдать новый временный пароль (показывается один раз)
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '200': {description: Временный пароль, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordReset'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/revoke-sessions:
    post:
      tags: [administration]
      operationId: revokeUserSessions
      summary: Завершить все сеансы пользователя
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Сеансы завершены}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/import:
    post:
      tags: [administration]
      operationId: importUsers
      summary: Массовое создание учеников и сотрудников с автоматическим зачислением
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserImportRequest'}}}}
      responses:
        '200': {description: Результат импорта или проверки, content: {application/json: {schema: {$ref: '#/components/schemas/UserImportResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /enrollments/bulk:
    post:
      tags: [administration]
      operationId: bulkEnroll
      summary: Зачислить нескольких учеников в класс
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BulkEnrollRequest'}}}}
      responses:
        '200': {description: Итог зачисления, content: {application/json: {schema: {$ref: '#/components/schemas/BulkResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /classes/{id}/promote:
    post:
      tags: [administration]
      operationId: promoteClass
      summary: Перевести всех учеников класса в другой класс
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PromoteClassRequest'}}}}
      responses:
        '200': {description: Итог перевода, content: {application/json: {schema: {$ref: '#/components/schemas/BulkResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /invitations:
    get:
      tags: [administration]
      operationId: listInvitations
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {description: Приглашения, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Invitation'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [administration]
      operationId: createInvitation
      summary: Создать одноразовое приглашение для саморегистрации
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationInput'}}}}
      responses:
        '201': {description: Приглашение создано; код показывается один раз, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreated'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /invitations/{id}:
    delete:
      tags: [administration]
      operationId: revokeInvitation
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Приглашение отозвано}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /invitations/lookup:
    get:
      tags: [auth]
      operationId: lookupInvitation
      summary: Проверить код приглашения (без входа в систему)
      security: []
      parameters: [{name: code, in: query, required: true, schema: {type: string, minLength: 8, maxLength: 64}}]
      responses:
        '200': {description: Сведения о приглашении, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationLookup'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/register:
    post:
      tags: [auth]
      operationId: registerWithInvitation
      summary: Регистрация по приглашению
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '201': {description: Учётная запись создана, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/schedule-entries:
    get:
      tags: [administration]
      operationId: listAdminScheduleEntries
      summary: Недельный шаблон расписания для редактирования
      parameters:
        - {name: class_id, in: query, schema: {type: string, format: uuid}}
        - {name: teacher_id, in: query, schema: {type: string, format: uuid}}
        - {name: academic_period_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Строки шаблона, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ScheduleEntry'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /schedule-entries/{id}:
    patch:
      tags: [administration]
      operationId: updateScheduleEntry
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleEntryUpdate'}}}}
      responses:
        '200': {description: Строка обновлена, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleEntry'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    delete:
      tags: [administration]
      operationId: deleteScheduleEntry
      summary: Удалить строку шаблона (созданные уроки сохраняются)
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Строка удалена}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /schedule/generate:
    post:
      tags: [administration]
      operationId: generateLessons
      summary: Создать уроки по недельному шаблону на период дат
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenerateLessonsRequest'}}}}
      responses:
        '200': {description: Итог генерации, content: {application/json: {schema: {$ref: '#/components/schemas/GenerateLessonsResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /analytics/student:
    get:
      tags: [learning]
      operationId: studentAnalytics
      summary: Показатели ученика для дашборда ученика и родителя
      parameters:
        - {name: student_id, in: query, schema: {type: string, format: uuid}}
        - {name: academic_period_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Аналитика, content: {application/json: {schema: {$ref: '#/components/schemas/StudentAnalytics'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /analytics/teacher:
    get:
      tags: [learning]
      operationId: teacherAnalytics
      summary: Показатели учителя по своим классам
      parameters: [{name: academic_period_id, in: query, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Аналитика, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAnalytics'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/school:
    get:
      tags: [administration]
      operationId: schoolAnalytics
      summary: Сводка по школе для администратора и руководителя
      parameters: [{name: academic_period_id, in: query, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Аналитика, content: {application/json: {schema: {$ref: '#/components/schemas/SchoolAnalytics'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/overview:
    get:
      tags: [administration]
      operationId: systemOverview
      summary: Нагрузка на систему и сервисы (только системный администратор)
      responses:
        '200': {description: Состояние системы, content: {application/json: {schema: {$ref: '#/components/schemas/SystemOverview'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: diary_session}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 32}}
    Version: {name: version, in: query, required: true, schema: {type: integer, minimum: 1}}
    Idempotency: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
  requestBodies:
    Login:
      x-go-name: LoginPayload
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [login, password]
            properties:
              login: {type: string, minLength: 3, maxLength: 64}
              password: {type: string, minLength: 1, maxLength: 128}
    AcademicYear:
      x-go-name: AcademicYearPayload
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/AcademicYearInput'}}}
    Named:
      x-go-name: NamedPayload
      required: true
      content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 160}, short_name: {type: string, maxLength: 32}}}}}
    Enrollment:
      x-go-name: EnrollmentPayload
      required: true
      content: {application/json: {schema: {type: object, required: [student_id, class_id, starts_on], properties: {student_id: {type: string, format: uuid}, class_id: {type: string, format: uuid}, starts_on: {type: string, format: date}, ends_on: {type: string, format: date}}}}}
    TeachingAssignment:
      x-go-name: TeachingAssignmentPayload
      required: true
      content: {application/json: {schema: {type: object, required: [teacher_id, class_id, subject_id, academic_period_id, starts_on], properties: {teacher_id: {type: string, format: uuid}, class_id: {type: string, format: uuid}, subject_id: {type: string, format: uuid}, academic_period_id: {type: string, format: uuid}, starts_on: {type: string, format: date}, ends_on: {type: string, format: date}}}}}
    Lesson:
      x-go-name: LessonPayload
      required: true
      content: {application/json: {schema: {type: object, required: [lesson_date, starts_at, ends_at, class_id, subject_id, teacher_id, academic_period_id], properties: {lesson_date: {type: string, format: date}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}, class_id: {type: string, format: uuid}, subject_id: {type: string, format: uuid}, teacher_id: {type: string, format: uuid}, room_id: {type: string, format: uuid}, academic_period_id: {type: string, format: uuid}, topic: {type: string, maxLength: 1000}}}}}
    Grade:
      x-go-name: GradePayload
      required: true
      content: {application/json: {schema: {type: object, required: [student_id, lesson_work_id, value], properties: {student_id: {type: string, format: uuid}, lesson_work_id: {type: string, format: uuid}, value: {type: number, minimum: 0}, comment: {type: string, maxLength: 1000}}}}}
    Attendance:
      x-go-name: AttendancePayload
      required: true
      content: {application/json: {schema: {type: object, required: [lesson_id, student_id, status], properties: {lesson_id: {type: string, format: uuid}, student_id: {type: string, format: uuid}, status: {type: string, enum: [present, absent, late, excused, exempt]}, reason: {type: string, maxLength: 1000}, comment: {type: string, maxLength: 1000}}}}}
    Homework:
      x-go-name: HomeworkPayload
      required: true
      content: {application/json: {schema: {type: object, required: [class_id, subject_id, text, due_date, status], properties: {class_id: {type: string, format: uuid}, subject_id: {type: string, format: uuid}, lesson_id: {type: string, format: uuid}, text: {type: string, minLength: 1, maxLength: 10000}, due_date: {type: string, format: date}, status: {type: string, enum: [draft, published]}, student_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}}}}}
  responses:
    LoginOK:
      description: Вход выполнен
      headers:
        Set-Cookie: {description: HTTP-only session cookie, schema: {type: string}}
      content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}
    UsersOK:
      description: Пользователи
      content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}
    BadRequest: {description: Некорректный запрос, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: Не аутентифицирован, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Действие запрещено, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Объект не существует или недоступен, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: "Конфликт версии, расписания или состояния", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    TooLarge: {description: Превышен размер тела, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unprocessable: {description: Ошибка доменных данных, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    RateLimited: {description: Слишком много попыток, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Internal: {description: Внутренняя ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    SchoolSettings:
      type: object
      required: [school_name, timezone]
      properties:
        school_name: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, minLength: 1, maxLength: 64}
    GradeScale:
      type: object
      required: [id, name, allowed_values, is_active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        allowed_values: {type: array, items: {type: number}}
        is_active: {type: boolean}
    ScheduleEntryInput:
      type: object
      required: [class_id, subject_id, teacher_id, academic_period_id, weekday, lesson_number, starts_at, ends_at, valid_from]
      properties:
        class_id: {type: string, format: uuid}
        subject_id: {type: string, format: uuid}
        teacher_id: {type: string, format: uuid}
        room_id: {type: string, format: uuid}
        academic_period_id: {type: string, format: uuid}
        weekday: {type: integer, minimum: 1, maximum: 7}
        lesson_number: {type: integer, minimum: 1, maximum: 12}
        starts_at: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}
        ends_at: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        week_parity: {type: integer, minimum: 0, maximum: 2, default: 0}
    ScheduleEntry:
      allOf:
        - {$ref: '#/components/schemas/ScheduleEntryInput'}
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
            class_name: {type: string}
            subject_name: {type: string}
            room_name: {type: string, nullable: true}
            teacher_name: {type: string}
    CurrentLessons:
      type: object
      properties:
        current: {$ref: '#/components/schemas/Lesson'}
        next: {$ref: '#/components/schemas/Lesson'}
    Role: {type: string, enum: [system_admin, administrator, teacher, class_teacher, student, parent, principal]}
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        field_errors: {type: object, additionalProperties: {type: string}}
    User:
      type: object
      required: [id, login, display_name, is_active, must_change_password, roles]
      properties:
        id: {type: string, format: uuid}
        login: {type: string}
        display_name: {type: string}
        is_active: {type: boolean}
        must_change_password: {type: boolean}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        student_id: {type: string, format: uuid}
        teacher_id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid}
        last_login_at: {type: string, format: date-time, nullable: true}
        class_name: {type: string, nullable: true}
    LoginResponse:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          required: [csrf_token]
          properties: {csrf_token: {type: string}}
    ParentStudentLink:
      type: object
      required: [parent_id, student_id, valid_from, parent_name, student_name, active]
      properties:
        parent_id: {type: string, format: uuid}
        student_id: {type: string, format: uuid}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date, nullable: true}
        parent_name: {type: string}
        student_name: {type: string}
        class_name: {type: string, nullable: true}
        active:
          type: boolean
          description: Связь действует сегодня по часовому поясу школы — а не по часам компьютера, на котором открыт дневник
    ChildSuggestion:
      type: object
      required: [student_id, display_name, reasons]
      properties:
        student_id: {type: string, format: uuid}
        display_name: {type: string}
        class_name: {type: string, nullable: true}
        reasons:
          type: array
          description: surname — та же фамилия (с учётом мужской и женской формы), patronymic — отчество ребёнка образовано от имени родителя
          items: {type: string, enum: [surname, patronymic]}
    SubstitutionLesson:
      type: object
