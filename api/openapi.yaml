openapi: 3.0.3
info:
  title: Школьный дневник API
  version: 1.0.0
  description: REST API локального школьного дневника.
  license: {name: MIT}
servers: [{url: /api/v1}]
security: [{sessionCookie: []}]
tags:
  - {name: auth}
  - {name: administration}
  - {name: journal}
  - {name: learning}
  - {name: content}
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses:
        '200': {$ref: '#/components/responses/LoginOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Сессия завершена}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: {type: string, minLength: 1}
                new_password: {type: string, minLength: 12, maxLength: 128}
      responses:
        '204': {description: "Пароль изменён, другие сессии отозваны"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: Текущий пользователь
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users:
    get:
      tags: [administration]
      operationId: listUsers
      summary: Пользователи с поиском и фильтрами; общее число в заголовке X-Total-Count
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive, all], default: active}}
        - {name: class_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/UsersOK'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [administration]
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, display_name, roles]
              properties:
                login: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, minLength: 12, maxLength: 128}
                display_name: {type: string, minLength: 1, maxLength: 160}
                roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Role'}}
                student_code: {type: string, maxLength: 64}
                class_id: {type: string, format: uuid}
      responses:
        '201': {description: Пользователь создан, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /users/{id}:
    patch:
      tags: [administration]
      operationId: updateUser
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {display_name: {type: string, minLength: 1, maxLength: 160}, roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Role'}}}}}}}
      responses:
        '200': {description: Профиль обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [administration]
      operationId: deactivateUser
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Пользователь деактивирован}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /academic-years:
    get:
      tags: [administration]
      operationId: listAcademicYears
      responses: {'200': {description: Учебные годы, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AcademicYear'}}}}}}
    post:
      tags: [administration]
      operationId: createAcademicYear
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AcademicYear'}
      responses: {'201': {description: Создан, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicYear'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /academic-periods:
    get:
      tags: [administration]
      operationId: listAcademicPeriods
      description: Без academic_year_id — периоды всех неархивных учебных лет по дате начала.
      parameters: [{name: academic_year_id, in: query, required: false, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Периоды, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AcademicPeriod'}}}}}}
    post:
      tags: [administration]
      operationId: createAcademicPeriod
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/AcademicYearInput'}
                - type: object
                  required: [academic_year_id]
                  properties: {academic_year_id: {type: string, format: uuid}}
      responses: {'201': {description: Создан, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicPeriod'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /academic-periods/{id}/close:
    post:
      tags: [administration]
      operationId: closeAcademicPeriod
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Период закрыт}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /academic-periods/{id}/late-edits:
    put:
      tags: [administration]
      operationId: setLateEdits
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [allowed], properties: {allowed: {type: boolean}}}}}}
      responses: {'204': {description: Разрешение изменено}, '403': {$ref: '#/components/responses/Forbidden'}}
  /academic-periods/{id}/carry-over:
    post:
      tags: [administration]
      operationId: carryOverAcademicPeriod
      summary: Перенести в период назначения учителей и недельный шаблон расписания из другого периода
      description: >-
        Переносятся назначения и строки шаблона, действующие на последний день исходного периода; в целевом периоде они
        начинаются с его первого дня. Уже существующие назначения на класс и предмет и занятые слоты шаблона пропускаются,
        поэтому повторный вызов ничего не дублирует.
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CarryOverRequest'}}}}
      responses:
        '200': {description: Итог переноса, content: {application/json: {schema: {$ref: '#/components/schemas/CarryOverResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /classes:
    get:
      tags: [administration]
      operationId: listClasses
      responses: {'200': {description: Классы, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NamedEntity'}}}}}}
    post:
      tags: [administration]
      operationId: createClass
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [academic_year_id, name], properties: {academic_year_id: {type: string, format: uuid}, name: {type: string, minLength: 1, maxLength: 32}}}}}}
      responses: {'201': {description: Создан, content: {application/json: {schema: {$ref: '#/components/schemas/NamedEntity'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /classes/{id}/students:
    get:
      tags: [administration]
      operationId: listClassStudents
      parameters: [{$ref: '#/components/parameters/ID'}, {name: date, in: query, required: true, schema: {type: string, format: date}}]
      responses: {'200': {description: Ученики, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Student'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /subjects:
    get:
      tags: [administration]
      operationId: listSubjects
      responses: {'200': {description: Предметы, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NamedEntity'}}}}}}
    post:
      tags: [administration]
      operationId: createSubject
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Named'}
      responses: {'201': {description: Создан, content: {application/json: {schema: {$ref: '#/components/schemas/NamedEntity'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /rooms:
    get:
      tags: [administration]
      operationId: listRooms
      responses: {'200': {description: Кабинеты, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NamedEntity'}}}}}}
    post:
      tags: [administration]
      operationId: createRoom
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Named'}
      responses: {'201': {description: Создан, content: {application/json: {schema: {$ref: '#/components/schemas/NamedEntity'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /enrollments:
    get:
      tags: [administration]
      operationId: listEnrollments
      summary: Зачисления (администратор), по желанию только одного класса
      parameters: [{name: class_id, in: query, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Зачисления, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [administration]
      operationId: createEnrollment
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Enrollment'}
      responses: {'201': {description: Ученик зачислен, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /teaching-assignments:
    get:
      tags: [administration]
      operationId: listTeachingAssignments
      responses: {'200': {description: Назначения, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}}
    post:
      tags: [administration]
      operationId: createTeachingAssignment
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/TeachingAssignment'}
      responses: {'201': {description: Назначение создано, content: {application/json: {schema: {$ref: '#/components/schemas/TeachingAssignment'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /class-teachers:
    get:
      tags: [administration]
      operationId: listClassTeachers
      responses: {'200': {description: Назначения классных руководителей, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [administration]
      operationId: assignClassTeacher
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [teacher_id, class_id, starts_on], properties: {teacher_id: {type: string, format: uuid}, class_id: {type: string, format: uuid}, starts_on: {type: string, format: date}, ends_on: {type: string, format: date}}}}}}
      responses: {'204': {description: Классный руководитель назначен}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /parent-student:
    get:
      tags: [administration]
      operationId: listParentStudentLinks
      responses: {'200': {description: Связи родителей и учеников с именами и текущим классом ребёнка, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ParentStudentLink'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [administration]
      operationId: linkParentStudent
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [parent_id, student_id, valid_from], properties: {parent_id: {type: string, format: uuid}, student_id: {type: string, format: uuid}, valid_from: {type: string, format: date}, valid_to: {type: string, format: date}}}}}}
      responses: {'204': {description: Связь создана}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/Unprocessable'}}
    put:
      tags: [administration]
      operationId: updateParentStudent
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [parent_id, student_id, valid_from], properties: {parent_id: {type: string, format: uuid}, student_id: {type: string, format: uuid}, valid_from: {type: string, format: date}, valid_to: {type: string, format: date}}}}}}
      responses: {'204': {description: Связь обновлена}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/Unprocessable'}}
    delete:
      tags: [administration]
      operationId: removeParentStudent
      summary: Снять связь сразу. Связь, начатую сегодня (по часовому поясу школы) или позже, сервер удаляет; давнюю завершает вчерашним днём, чтобы сохранилась история доступа
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {name: parent_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: student_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: valid_from, in: query, required: true, schema: {type: string, format: date}}
      responses: {'204': {description: Связь снята}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /parent-student/suggestions:
    get:
      tags: [administration]
      operationId: suggestChildrenForParent
      summary: Вероятные дети родителя — по фамилии и по отчеству, образованному от имени родителя; уже связанные не предлагаются
      parameters: [{name: parent_id, in: query, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Подсказки, лучшие первыми, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ChildSuggestion'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /children:
    get:
      tags: [learning]
      operationId: listChildren
      responses: {'200': {description: Дети родителя, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Student'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /academic-years/{id}:
    patch:
      tags: [administration]
      operationId: updateAcademicYear
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AcademicYear'}
      responses: {'200': {description: Учебный год обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicYear'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
    delete:
      tags: [administration]
      operationId: archiveAcademicYear
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Учебный год архивирован}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /academic-periods/{id}:
    patch:
      tags: [administration]
      operationId: updateAcademicPeriod
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, starts_on, ends_on], properties: {name: {type: string, minLength: 1, maxLength: 64}, starts_on: {type: string, format: date}, ends_on: {type: string, format: date}}}}}}
      responses: {'200': {description: Период обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicPeriod'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /classes/{id}:
    patch:
      tags: [administration]
      operationId: updateClass
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 32}}}}}}
      responses: {'200': {description: Класс обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/NamedEntity'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
    delete:
      tags: [administration]
      operationId: archiveClass
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Класс архивирован, журнал сохранён}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /subjects/{id}:
    patch:
      tags: [administration]
      operationId: updateSubject
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Named'}
      responses: {'200': {description: Предмет обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/NamedEntity'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
    delete:
      tags: [administration]
      operationId: archiveSubject
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Предмет архивирован, журнал сохранён}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /rooms/{id}:
    patch:
      tags: [administration]
      operationId: updateRoom
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Named'}
      responses: {'200': {description: Кабинет обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/NamedEntity'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
    delete:
      tags: [administration]
      operationId: archiveRoom
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {description: Кабинет архивирован, журнал сохранён}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /enrollments/{id}:
    patch:
      tags: [administration]
      operationId: updateEnrollment
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {ends_on: {type: string, format: date}}}}}}
      responses: {'200': {description: Зачисление обновлено, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /teaching-assignments/{id}:
    patch:
      tags: [administration]
      operationId: updateTeachingAssignment
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {ends_on: {type: string, format: date}}}}}}
      responses: {'200': {description: Назначение обновлено, content: {application/json: {schema: {$ref: '#/components/schemas/TeachingAssignment'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /class-teachers/{id}:
    patch:
      tags: [administration]
      operationId: updateClassTeacher
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {ends_on: {type: string, format: date}}}}}}
      responses: {'204': {description: Назначение классного руководителя обновлено}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /school/settings:
    get:
      tags: [administration]
      operationId: getSchoolSettings
      responses: {'200': {description: Настройки школы, content: {application/json: {schema: {$ref: '#/components/schemas/SchoolSettings'}}}}}
    put:
      tags: [administration]
      operationId: updateSchoolSettings
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SchoolSettings'}}}}
      responses: {'200': {description: Настройки сохранены, content: {application/json: {schema: {$ref: '#/components/schemas/SchoolSettings'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/Unprocessable'}}
  /grade-scales:
    get:
      tags: [administration]
      operationId: listGradeScales
      responses: {'200': {description: Шкалы оценок, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GradeScale'}}}}}}
    post:
      tags: [administration]
