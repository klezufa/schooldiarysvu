# Профиль https. HSTS по умолчанию ВЫКЛЮЧЕН: включайте только после того, как имя дневника стабильно открывается
# по HTTPS с доверенным сертификатом на всех устройствах. Браузеры запоминают HSTS на max-age — при проблеме
# с сертификатом сайт станет недоступен без возможности «продолжить» (docs/https.md, раздел HSTS).
# Сначала проверьте с коротким сроком, затем увеличьте:
# add_header Strict-Transport-Security "max-age=86400" always;
# add_header Strict-Transport-Security "max-age=31536000" always;
