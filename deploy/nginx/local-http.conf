# Профиль local-http: только изолированная сеть, разработка или пилот. Трафик НЕ шифруется —
# не считайте этот режим защищённой эксплуатацией (docs/https.md). HSTS здесь запрещён.
server {
    listen 8080;
    server_name _;
    # Версия Nginx в заголовке Server и на страницах ошибок облегчает подбор известных уязвимостей.
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    include /etc/nginx/snippets/locations.conf;
}
