# Профиль https (docker-compose.https.yml). Сертификат и ключ монтируются только для чтения в /etc/nginx/tls.
# Порт 8080 только перенаправляет на HTTPS; health доступен по HTTP для локальных проверок на самом сервере.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location ~ ^/health/(live|ready)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    # Версия Nginx в заголовке Server и на страницах ошибок облегчает подбор известных уязвимостей.
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # Mozilla «intermediate»: TLS 1.2 и 1.3, только AEAD-шифры с прямой секретностью. TLS 1.0/1.1 отключены.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:diary_tls:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/locations.conf;
}
