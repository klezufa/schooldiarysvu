# Общие маршруты для профилей local-http и https. Подключается внутри server { ... }.
# Заголовки безопасности подключаются в каждый location с собственными add_header: Nginx не наследует
# заголовки уровня server, если в location есть свой add_header.

location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/profile-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /api/v1/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Перезаписывает любой присланный клиентом X-Real-IP: backend доверяет этому заголовку (TRUST_PROXY_HEADERS).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    include /etc/nginx/snippets/profile-headers.conf;
    add_header Cache-Control "no-store" always;
}

location ~ ^/health/(live|ready)$ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/profile-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
